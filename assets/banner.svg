<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b16"/>
      <stop offset="55%" stop-color="#0b1424"/>
      <stop offset="100%" stop-color="#0d1b2e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="switchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5f6ff"/>
      <stop offset="100%" stop-color="#9fdcff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>

  <circle cx="920" cy="90" r="220" fill="url(#glow1)"/>
  <circle cx="1040" cy="270" r="180" fill="url(#glow2)"/>

  <g opacity="0.14" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="340" x2="1200" y2="340"/>
  </g>

  <g opacity="0.85">
    <path d="M 700 300 Q 800 200 900 240 T 1080 150" fill="none" stroke="url(#lineGrad)" stroke-width="2.5"/>
    <path d="M 720 250 Q 830 260 920 180 T 1100 90" fill="none" stroke="url(#lineGrad)" stroke-width="2"/>
    <path d="M 690 190 Q 780 130 880 150 T 1060 240" fill="none" stroke="url(#lineGrad)" stroke-width="1.5"/>
  </g>

  <g>
    <circle cx="900" cy="240" r="7" fill="url(#nodeGrad)"/>
    <circle cx="1080" cy="150" r="9" fill="url(#nodeGrad)"/>
    <circle cx="920" cy="180" r="6" fill="url(#nodeGrad)"/>
    <circle cx="1100" cy="90" r="8" fill="url(#nodeGrad)"/>
    <circle cx="880" cy="150" r="6" fill="url(#nodeGrad)"/>
    <circle cx="1060" cy="240" r="7" fill="url(#nodeGrad)"/>
    <circle cx="700" cy="300" r="10" fill="#0d1b2e" stroke="#22d3ee" stroke-width="2"/>
  </g>

  <g transform="translate(940,60)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
    <path d="M -46 0 A 46 46 0 0 1 46 0" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="-46" x2="0" y2="46" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  </g>

  <g transform="translate(760,60)">
    <rect x="0" y="0" width="86" height="40" rx="20" fill="#0b1424" stroke="url(#switchGrad)" stroke-width="2.5"/>
    <circle cx="63" cy="20" r="13" fill="url(#switchGrad)"/>
  </g>

  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" fill="url(#headGrad)" textLength="760" lengthAdjust="spacingAndGlyphs">
    DNS Changer
  </text>
  <text x="60" y="222" font-family="'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" fill="url(#headGrad)" textLength="420" lengthAdjust="spacingAndGlyphs">
    Desktop
  </text>

  <text x="60" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#9fb3c8" textLength="1000" lengthAdjust="spacingAndGlyphs">
    Switches your Windows DNS settings right, without the usual
  </text>
  <text x="60" y="298" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#9fb3c8" textLength="480" lengthAdjust="spacingAndGlyphs">
    network-panel hassle
  </text>

  <g opacity="0.6">
    <circle cx="120" cy="80" r="2.5" fill="#38bdf8"/>
    <circle cx="180" cy="60" r="2" fill="#22d3ee"/>
    <circle cx="220" cy="95" r="1.8" fill="#34d399"/>
    <circle cx="150" cy="120" r="1.6" fill="#38bdf8"/>
  </g>
</svg>